services:
  lab:
    build: .
    image: discovery-lab:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m,mode=1777]
    volumes:
      - lab-data:/data
    restart: "no"
    mem_limit: 512m
    cpus: 1
  crawl-tools:
    profiles: [tools]
    build:
      context: .
      target: crawl-tools
    image: discovery-crawl-tools:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m,mode=1777]
    restart: "no"
    mem_limit: 512m
    cpus: 1
  browser-tools:
    profiles: [browser]
    build:
      context: .
      target: browser-tools
    image: discovery-browser-tools:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m,mode=1777]
    shm_size: 256m
    restart: "no"
    mem_limit: 1g
    cpus: 1
  adaptive:
    profiles: [adaptive]
    build:
      context: .
      target: adaptive-tools
    image: discovery-adaptive:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m,mode=1777]
    shm_size: 256m
    volumes:
      - lab-data:/data
    restart: "no"
    mem_limit: 2g
    cpus: 1
  bot-diagnostics:
    profiles: [bot-diagnostics]
    build:
      context: .
      dockerfile: experiments/bot-diagnostics/Dockerfile
    image: discovery-bot-diagnostics:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/lab:size=32m,uid=10001,gid=10001,mode=0700
    shm_size: 256m
    volumes:
      - lab-data:/data
    restart: "no"
    mem_limit: 2g
    cpus: 2
volumes:
  lab-data:
