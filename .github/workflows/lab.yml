name: lab-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p 'test_cloud_setup.py'
      - run: python -B -m unittest discover -s tests -p 'test_browser_benchmark.py'
      - run: python -m pip install -r .agents/skills/kaggle-ops/requirements.txt
      - run: python -B -m unittest discover -s tests -p 'test_kaggle_ops.py'
      - name: Restore and validate the public code distribution
        run: |
          python -B scripts/package_cloud.py --output "$RUNNER_TEMP/lab-source.zip"
          python -m zipfile -e "$RUNNER_TEMP/lab-source.zip" "$RUNNER_TEMP/lab-source"
          cd "$RUNNER_TEMP/lab-source"
          python -B -m unittest discover -s tests -p 'test_lab*.py'
          node experiments/bot-diagnostics/framework.mjs plan --all-options
      - run: docker compose config --quiet
      - run: docker build -t discovery-lab:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:size=32m --mount type=volume,src=lab-ci,dst=/data discovery-lab:ci demo --run /data/demo
      - run: docker run --rm --network none --read-only --mount type=volume,src=lab-ci,dst=/data discovery-lab:ci verify --run /data/demo
      - run: docker image inspect discovery-lab:ci --format 'image_bytes={{.Size}} user={{.Config.User}}'
  optional-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target crawl-tools -t discovery-crawl-tools:ci .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=128m,mode=1777 discovery-crawl-tools:ci
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=128m,mode=1777 --mount type=bind,src="$PWD/tests",dst=/app/tests,readonly --entrypoint python discovery-crawl-tools:ci -B -m unittest discover -s tests -p test_impit.py -v
      - run: docker build --target browser-tools -t discovery-browser-tools:ci .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=256m,mode=1777 --shm-size=256m discovery-browser-tools:ci
      - run: docker build --target adaptive-tools -t discovery-adaptive:ci .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=256m,mode=1777 --shm-size=256m --mount type=bind,src="$PWD/tests",dst=/app/tests,readonly --env CRAWLEE_LOG_LEVEL=ERROR --entrypoint python discovery-adaptive:ci -B -m unittest discover -s tests -p test_adaptive.py -v
      - run: docker image inspect discovery-crawl-tools:ci discovery-browser-tools:ci discovery-adaptive:ci --format 'image={{index .RepoTags 0}} bytes={{.Size}} user={{.Config.User}}'
