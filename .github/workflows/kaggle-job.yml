name: kaggle-job
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'quota: 残量確認 / submit: 新規実行と待機 / resume: 同じversionの回収再開'
        type: choice
        options: [quota, submit, resume]
        default: quota
        required: true
      notebook_folder:
        description: 'submit時: mainに保存済みのNotebook専用ディレクトリ'
        type: string
      kernel_ref:
        description: 'resume時: job.jsonのowner/slug'
        type: string
      kernel_version:
        description: 'resume時: job.jsonのversion整数'
        type: string
      wait_seconds:
        description: '待機秒数 1..19800（待機終了でKaggleジョブは停止しない）'
        type: string
        default: '18000'
permissions:
  contents: read
concurrency:
  group: kaggle-operations
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .agents/skills/kaggle-ops/requirements.txt
      - name: Operate Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_JOB_ACTION: ${{ inputs.operation }}
          KAGGLE_NOTEBOOK_FOLDER: ${{ inputs.notebook_folder }}
          KAGGLE_KERNEL_REF: ${{ inputs.kernel_ref }}
          KAGGLE_KERNEL_VERSION: ${{ inputs.kernel_version }}
          KAGGLE_WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: python -B .agents/skills/kaggle-ops/scripts/kaggle_ops.py cloud-run --output .lab-output/kaggle-result
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: kaggle-results
          path: .lab-output/kaggle-result/
          if-no-files-found: ignore
          retention-days: 7
